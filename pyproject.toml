[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sf-session"
version = "0.1.0"
description = "Salesforce session management and report automation tools"
requires-python = ">=3.12"
dependencies = [
    "jpholiday",
    "openpyxl",
    "python-dotenv",
    "requests",
    "selenium",
    "simple-salesforce",
]

[tool.hatch.build.targets.wheel]
packages = ["sf_session"]

[tool.pytest.ini_options]
cache_dir = "sf_session/.pytest_cache"
